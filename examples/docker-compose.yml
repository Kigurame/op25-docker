# Run the published op25-docker image straight from Docker Hub.
#
#   docker compose up -d
#
# First boot seeds ./conf with default configs; then edit conf/cfg.json
# (control channel frequency) and conf/stream.json (icecast passwords). The
# admin password is generated on first boot and printed to the log
# (docker compose logs op25 | grep -i password).
services:
  op25:
    image: kigurame2/op25-docker:latest
    container_name: op25
    restart: unless-stopped
    # USB access to the RTL-SDR dongle. Some hosts/kernels need `privileged: true`
    # for reliable USB passthrough; start with the device mapping below.
    devices:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - "8080:8080"   # web control plane
      - "8000:8000"   # icecast (VLC / external players) — if you change the host port (e.g. "9000:8000"), also set icecast.external_port to 9000 in conf/stream.json so the web UI's Listen/Copy URL links use it
    volumes:
      - ./conf:/opt/op25/conf          # your editable config (seeded with defaults)
      - ./logs:/var/log/op25           # op25 / streams / web logs
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=UTC
      # Signs web-control-plane session tokens. If unset, the container
      # generates a random one on each start (sessions reset on every restart).
      # Set it once, e.g. `openssl rand -hex 32` in your shell before
      # `docker compose up`, so sessions survive restarts.
      - OP25_SESSION_SECRET=${OP25_SESSION_SECRET:-}
    tmpfs:
      - /tmp
